<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DA.R LIVE ADMIN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}.login{max-width:400px;margin:80px auto;padding:25px;background:#111;border:2px solid #fe2c55;border-radius:20px;text-align:center}h1{font-size:28px;margin-bottom:5px}h1 span{color:#fe2c55}input{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:none;background:#222;color:#fff;font-size:16px}button{width:100%;padding:15px;background:#fe2c55;color:#fff;border:none;border-radius:25px;font-weight:bold;font-size:16px;cursor:pointer}#msg{margin-top:10px;color:yellow}.dash{display:none;padding:20px}.card{background:#111;padding:20px;border-radius:15px;margin:10px 0;border:1px solid #333}.card h3{color:#fe2c55}.btn2{background:#25D366;padding:12px;border-radius:10px;display:block;text-align:center;color:#fff;text-decoration:none;margin-top:10px;font-weight:bold}</style></head><body>
<div id="loginBox" class="login"><h1>DA.R <span>LIVE</span> ADMIN</h1><p style="color:#888">CONTROL YOUR PLATFORM 🔒</p><input id="email" value="mdimerant@gmail.com"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="login()">SE CONNECTER 🔑</button><p id="msg"></p></div>
<div id="dash" class="dash"><h1>👑 Bienvenue, Admin 12!</h1><p style="color:#25D366">✅ Ou konekte kòm SUPER ADMIN</p><div class="card"><h3>🎬 Publier Vidéo</h3><p>Publie yon nouvo video pou tout moun wè.</p><a class="btn2" href="https://dar-live.vercel.app/admin.html" onclick="alert('Sèvi ak paj sa a pou pibliye');return false;">+ PUBLIER</a></div><div class="card"><h3>📊 Statistiques</h3><p id="stats">Ap chaje...</p></div><div class="card"><h3>👥 Utilisateurs</h3><p id="users">Ap chaje...</p></div><button onclick="logout()" style="background:#333">DÉCONNECTER</button></div>
<script>
const sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
async function login(){
  document.getElementById('msg').innerText="Ap konekte... ⏳";
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('msg').innerText="ERÈ: "+error.message;return;}
  const {data:prof}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
  if(!prof || (!prof.is_admin && !prof.is_super_admin)){document.getElementById('msg').innerText="Ou pa admin!";return;}
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').style.display='block';
  loadStats();
}
async function loadStats(){
  const {count}=await sb.from('profiles').select('*',{count:'exact',head:true});
  const {count:c2}=await sb.from('videos').select('*',{count:'exact',head:true});
  document.getElementById('stats').innerText="Utilisateurs: "+count+" | Vidéos: "+c2;
  const {data:u}=await sb.from('profiles').select('username,full_name').limit(10);
  document.getElementById('users').innerText=u.map(x=>x.username||x.full_name).join(", ");
}
async function logout(){await sb.auth.signOut();location.reload();}
</script></body></html>
