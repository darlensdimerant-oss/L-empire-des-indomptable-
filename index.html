<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DA.R LIVE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;overflow:hidden}.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}.logo{font-size:21px;font-weight:900}.logo span{color:#fe2c55}.top-btn{background:#fff;color:#000;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;text-decoration:none}.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video{height:100dvh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.video video{width:100%;height:auto;max-height:72vh;object-fit:contain;background:#000}.v-info{position:absolute;bottom:145px;left:14px;right:75px;z-index:10;text-shadow:0 2px 8px #000}.v-info h3{font-size:15px;font-weight:700}.v-info p{font-size:13px;color:#eee;margin-top:4px}.actions{position:absolute;right:10px;bottom:145px;display:flex;flex-direction:column;gap:18px;z-index:10;align-items:center}.act-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer}.act{font-size:32px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));transition:transform .15s}.act-wrap:active .act{transform:scale(1.2)}.act-count{font-size:13px;font-weight:700;margin-top:4px;text-shadow:0 1px 5px #000}.avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:2px}.sound-btn{position:absolute;top:70px;right:12px;z-index:50;background:rgba(0,0,0,.6);border:1px solid #fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}.sound-btn.on{background:#fe2c55}.tap-sound{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);padding:12px 18px;border-radius:25px;font-size:14px;font-weight:700;z-index:40;pointer-events:none;border:1px solid #fff;white-space:nowrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:7px 0 12px;z-index:100}.bottom a{color:#888;text-decoration:none;font-size:10px;text-align:center;font-weight:600}.bottom a.active{color:#fff}.bottom div{font-size:21px;line-height:1}.upload-btn{background:#fff!important;color:#000!important;padding:3px 13px;border-radius:8px;font-size:20px!important;font-weight:900!important}.admin-float{position:fixed;bottom:145px;left:12px;background:#fe2c55;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;z-index:99;border:2px solid #fff;opacity:.9}.login-box{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center}.login-box.show{display:flex}.card{background:#111;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;border:1px solid #333}.card input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff}.card button{width:100%;padding:13px;background:#fe2c55;border:none;color:#fff;border-radius:25px;font-weight:bold;margin-top:10px}.comments-sheet{position:fixed;left:0;right:0;bottom:0;height:65vh;background:#111;border-radius:20px 20px 0 0;z-index:300;display:none;flex-direction:column;transform:translateY(100%);transition:transform .3s}.comments-sheet.open{display:flex;transform:translateY(0)}.cm-head{padding:14px;text-align:center;font-weight:700;border-bottom:1px solid #222;position:relative}.cm-head span{position:absolute;right:14px;cursor:pointer;font-size:18px}.cm-list{flex:1;overflow-y:auto;padding:12px}.cm-item{display:flex;gap:10px;margin-bottom:14px}.cm-ava{width:32px;height:32px;border-radius:50%;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}.cm-input{display:flex;gap:8px;padding:10px;border-top:1px solid #222;background:#111}.cm-input input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}.cm-input button{background:#fe2c55;border:none;color:#fff;padding:0 18px;border-radius:20px;font-weight:700}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;display:none}.overlay.show{display:block}</style></head><body>
<div class="top"><div class="logo">DA.R <span>LIVE</span> 🇭🇹</div><a class="top-btn" href="#" onclick="openLogin();return false;">Connexion</a></div>
<div class="feed" id="feed"><div class="video"><h2>DA.R <span style="color:#fe2c55">LIVE</span><p style="color:#888;font-size:14px;margin-top:10px">Ap chaje... ⏳</p></h2></div></div>
<a href="admin2.html" class="admin-float">👑</a>
<div class="bottom"><a href="index.html" class="active"><div>🏠</div>Accueil</a><a href="concours.html"><div>🏆</div>Concours</a><a href="#" onclick="openLogin();return false;"><div class="upload-btn">+</div></a><a href="messages.html"><div>💬</div>Messages</a><a href="#" onclick="openLogin();return false;"><div>👤</div>Profil</a></div>
<div class="login-box" id="loginBox"><div class="card"><h2>DA.R <span style="color:#fe2c55">LIVE</span></h2><p style="color:#888;font-size:13px;margin:5px 0 10px">Connecte ou pou kontinye</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="doLogin()">SE CONNECTER</button><button onclick="doSignup()" style="background:#222">CRÉER COMPTE</button><p id="msg" style="color:yellow;font-size:13px;margin-top:10px"></p><p onclick="document.getElementById('loginBox').classList.remove('show')" style="color:#888;margin-top:10px;cursor:pointer">Fèmen ✕</p></div></div>
<div class="overlay" id="overlay" onclick="closeComments()"></div>
<div class="comments-sheet" id="cmSheet"><div class="cm-head"><span id="cmCount">0 komantè</span><span onclick="closeComments()">✕</span></div><div class="cm-list" id="cmList"><p style="text-align:center;color:#888;padding:20px">Pa gen komantè ankò.</p></div><div class="cm-input"><input id="cmText" placeholder="Ajoute yon komantè... 😍"><button onclick="sendComment()">▶</button></div></div>
<script>
const sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
let soundOn=true, unlocked=false, currentVideoId=null, currentCountEl=null;
function unlockSound(){if(unlocked)return;unlocked=true;document.querySelectorAll('video').forEach(v=>{v.muted=false;v.volume=1;v.play().catch(()=>{})});document.querySelectorAll('.sound-btn').forEach(b=>{b.innerHTML='🔊';b.classList.add('on')});document.querySelectorAll('.tap-sound').forEach(t=>t.style.display='none');}
document.addEventListener('touchstart',unlockSound,{passive:true});document.addEventListener('click',unlockSound);document.addEventListener('scroll',unlockSound,{passive:true});
function openLogin(){document.getElementById('loginBox').classList.add('show')}
async function doLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('msg').innerText=error.message}else{location.reload()}}
async function doSignup(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signUp({email:e,password:p});document.getElementById('msg').innerText=error?error.message:"Tcheke email ou! 📧"}
function fmt(n){if(n>=1000)return (n/1000).toFixed(1).replace('.0','')+' K';return n}
function toggleLike(el,countEl){el.parentElement.classList.toggle('liked');let c=parseInt(countEl.dataset.raw||0);if(el.parentElement.classList.contains('liked')){c++;el.innerHTML='❤️'}else{c--;el.innerHTML='🤍'}countEl.dataset.raw=c;countEl.innerText=fmt(c)}
function toggleSave(el,countEl){el.parentElement.classList.toggle('saved');let c=parseInt(countEl.dataset.raw||0);if(el.parentElement.classList.contains('saved')){c++;el.style.color='#fe2c55'}else{c--;el.style.color='#fff'}countEl.dataset.raw=c;countEl.innerText=fmt(c)}
function shareVideo(title){if(navigator.share){navigator.share({title:'DA.R LIVE',text:title,url:location.href})}else{alert('Lyen kopye! 📋')}}
function toggleSound(btn,vidId){const v=document.getElementById(vidId);soundOn=!soundOn;v.muted=!soundOn;v.volume=1;if(soundOn){v.play();btn.innerHTML='🔊';btn.classList.add('on');unlocked=true}else{btn.innerHTML='🔇';btn.classList.remove('on');}}
function tapVideo(v,btnId){if(!unlocked){unlockSound();return}if(v.paused)v.play();else v.pause();}
function openComments(videoId,countEl){currentVideoId=videoId;currentCountEl=countEl;document.getElementById('cmSheet').classList.add('open');document.getElementById('overlay').classList.add('show');loadComments(videoId)}
function closeComments(){document.getElementById('cmSheet').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
async function loadComments(videoId){const list=document.getElementById('cmList');const {data}=await sb.from('comments').select('*').eq('video_id',videoId).order('created_at',{ascending:false});if(!data||!data.length){list.innerHTML='<p style="text-align:center;color:#888;padding:20px">Pa gen komantè ankò. Se premye moun ki komante! 👇</p>';document.getElementById('cmCount').innerText='0 komantè';return}document.getElementById('cmCount').innerText=data.length+' komantè';list.innerHTML=data.map(c=>`<div class="cm-item"><div class="cm-ava">👤</div><div><b style="font-size:13px">@${(c.username||'fan').slice(0,12)}</b><p style="font-size:14px;margin-top:2px">${c.content}</p></div></div>`).join('')}
async function sendComment(){const txt=document.getElementById('cmText');const content=txt.value.trim();if(!content||!currentVideoId)return;const {data:{user}}=await sb.auth.getUser();const username=user?user.email.split('@')[0]:'fan';const {error}=await sb.from('comments').insert({video_id:currentVideoId,content,username});if(error){alert('Fè SQL comments la nan Supabase');return}txt.value='';loadComments(currentVideoId);if(currentCountEl){let c=parseInt(currentCountEl.dataset.raw||0)+1;currentCountEl.dataset.raw=c;currentCountEl.innerText=fmt(c)}}
async function loadVideos(){const {data}=await sb.from('videos').select('*,profiles(username)').order('created_at',{ascending:false}).limit(20);const feed=document.getElementById('feed');if(!data||!data.length){feed.innerHTML='<div class="video"><h2 style="text-align:center">Pa gen videyo ankò</h2></div>';return}feed.innerHTML=data.map((v,i)=>`<div class="video"><video id="vid${i}" src="${v.video_url||''}" loop playsinline autoplay muted onclick="tapVideo(this,'snd${i}')"></video><div class="tap-sound">👆 Manyen ekran an pou SON 🔊</div><div class="sound-btn on" id="snd${i}" onclick="toggleSound(this,'vid${i}')">🔊</div><div class="v-info"><h3>@${v.profiles?.username||'darlive'} • Suivre</h3><p>${v.title||''}</p></div><div class="actions"><div class="act-wrap"><div class="avatar">👤</div></div><div class="act-wrap" onclick="toggleLike(this.querySelector('.act'),this.querySelector('.act-count'))"><div class="act">🤍</div><span class="act-count" data-raw="${v.likes_count||0}">${fmt(v.likes_count||0)}</span></div><div class="act-wrap" onclick="openComments('${v.id}',this.querySelector('.act-count'))"><div class="act">💬</div><span class="act-count" data-raw="${v.comments_count||0}">${fmt(v.comments_count||0)}</span></div><div class="act-wrap" onclick="toggleSave(this.querySelector('.act'),this.querySelector('.act-count'))"><div class="act">🔖</div><span class="act-count" data-raw="${v.saves_count||0}">${fmt(v.saves_count||0)}</span></div><div class="act-wrap" onclick="shareVideo('${(v.title||'').replace(/'/g,'')}')"><div class="act">➡️</div><span class="act-count" data-raw="${v.shares_count||0}">${fmt(v.shares_count||0)}</span></div></div></div>`).join('');
// ESAYE SON OTOMATIK - si navigatè a kite l, li ap jwe ak son dirèk
const first=document.querySelector('video');if(first){first.muted=false;first.volume=1;first.play().then(()=>{unlocked=true;document.querySelectorAll('.tap-sound').forEach(t=>t.style.display='none')}).catch(()=>{/* ap tann premye touche */})}
const obs=new IntersectionObserver((es)=>{es.forEach(e=>{const vid=e.target.querySelector('video');if(!vid)return;if(e.isIntersecting){vid.muted=!unlocked;vid.volume=1;vid.play().catch(()=>{});}else vid.pause();})},{threshold:0.6});document.querySelectorAll('.video').forEach(el=>obs.observe(el));}
loadVideos();
</script></body></html>
