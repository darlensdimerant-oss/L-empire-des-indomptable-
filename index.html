<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da.R Live - Vidéos Courtes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
.logo{font-size:22px;font-weight:900}.logo span{color:#fe2c55}
.search{flex:1;margin:0 12px;background:#222;border-radius:20px;padding:8px 12px;display:flex}
.search input{background:transparent;border:none;outline:none;color:#fff;width:100%}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.video-card{height:100vh;scroll-snap-align:start;position:relative;display:flex;justify-content:center;background:#111}
.video-card video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:90px;left:14px;right:80px}
.overlay b{font-size:17px}.overlay p{font-size:14px;color:#ddd;margin-top:6px}
.actions{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:16px;align-items:center}
.act{width:52px;height:52px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;color:#fff;cursor:pointer}
.act.active{background:#fe2c55}
.act small{display:block;font-size:11px;text-align:center;margin-top:4px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
.bottom button{background:none;border:none;color:#fff;font-size:13px;cursor:pointer}
.bottom button.active{color:#fe2c55;font-weight:bold}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:50;padding:20px;overflow-y:auto}
.modal.open{display:block}
.card{background:#1a1a1a;border-radius:16px;padding:16px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:#fff;margin-top:8px}
.btn{background:#fe2c55;color:#fff;border:none;padding:13px;border-radius:10px;width:100%;margin-top:12px;font-weight:bold;cursor:pointer}
.btn-white{background:#fff;color:#000}
.avatar{width:44px;height:44px;border-radius:50%;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-weight:900}
.profile-head{display:flex;gap:12px;align-items:center}
.comment{background:#222;padding:10px;border-radius:10px;margin-top:8px;font-size:14px}
.badge{background:#fe2c55;padding:3px 8px;border-radius:10px;font-size:11px}
</style>
</head>
<body>
<header>
<div class="logo">Da.R <span>Live</span></div>
<div class="search"><input id="searchInput" placeholder="🔍 Rechercher..." oninput="searchVideo()"></div>
<div onclick="openModal('notifModal')">🔔</div>
</header>
<div class="feed" id="feed"></div>
<div class="bottom">
<button class="active" onclick="showHome()">🏠 Accueil</button>
<button onclick="openModal('trendModal')">🔥 Tendances</button>
<button onclick="openModal('uploadModal')" style="font-size:26px">＋</button>
<button onclick="openModal('msgModal')">💬 Messages</button>
<button onclick="openModal('profileModal')">👤 Moi</button>
</div>
<div class="modal" id="uploadModal">
<h2>📤 Publier une vidéo</h2>
<input type="file" id="videoFile" accept="video/*">
<input id="videoTitle" placeholder="Titre de ta vidéo...">
<textarea id="videoDesc" placeholder="Description... #darlive #haiti"></textarea>
<button class="btn" onclick="publishVideo()">Publier sur Da.R Live</button>
<button class="btn btn-white" onclick="closeModals()">Fermer</button>
</div>
<div class="modal" id="trendModal"><h2>🔥 Tendances Da.R Live</h2><div id="trendList"></div><button class="btn btn-white" onclick="closeModals()">Fermer</button></div>
<div class="modal" id="notifModal"><h2>🔔 Notifications</h2><div id="notifList"></div><button class="btn btn-white" onclick="closeModals()">Fermer</button></div>
<div class="modal" id="msgModal"><h2>💬 Messages Privés</h2><div class="card"><b>@darlens_officiel</b><p>Salut! Ta vidéo est géniale 🔥</p></div><input id="msgInput" placeholder="Écrire un message..."><button class="btn" onclick="sendMsg()">Envoyer</button><button class="btn btn-white" onclick="closeModals()">Fermer</button><div id="msgList"></div></div>
<div class="modal" id="profileModal">
<div class="profile-head"><div class="avatar">D</div><div><h2 id="profileName">@darlens</h2><p id="profileBio">Créateur Da.R Live 👑 | Haïti 🇭🇹</p></div></div>
<p style="margin:12px 0"><span id="statVideos">0</span> Vidéos • <span id="statLikes">0</span> Likes • <span id="statFollowers">1.2K</span> Abonnés</p>
<input id="editName" placeholder="Changer ton nom..."><input id="editBio" placeholder="Changer ta bio...">
<button class="btn" onclick="saveProfile()">Sauvegarder Profil</button>
<button class="btn" style="background:#000;border:1px solid #fe2c55" onclick="goLive()">🔴 ALLER EN LIVE</button>
<h3 style="margin-top:16px">Mes Vidéos</h3><div id="myVideos"></div>
<button class="btn btn-white" onclick="closeModals()">Fermer</button></div>
<div class="modal" id="commentModal"><h2>💬 Commentaires</h2><div id="commentList"></div><input id="commentInput" placeholder="Ajoute un commentaire..."><button class="btn" onclick="addComment()">Publier commentaire</button><button class="btn btn-white" onclick="closeModals()">Fermer</button></div>
<script>
let videos = JSON.parse(localStorage.getItem('darlive_videos')||'[]');
let currentCommentId = null;
if(videos.length===0){
  videos = [
    {id:1,title:"Bienvenue sur Da.R Live 👑",desc:"La nouvelle plateforme 100% Haïtienne #darlive",user:"@darlens",likes:1240,views:15400,comments:[{user:"@fan1",text:"Enfin! 🔥"}],url:"https://cdn.coverr.co/videos/coverr-dancing-in-the-street-1564/1080p.mp4",followed:false,liked:false},
    {id:2,title:"Danse Kompa 🔥🇭🇹",desc:"Qui peut faire mieux? #kompa #haiti",user:"@indomptable_queen",likes:890,views:9200,comments:[],url:"https://cdn.coverr.co/videos/coverr-people-dancing-at-a-party-1584/1080p.mp4",followed:false,liked:false},
    {id:3,title:"LIVE - Ann Pale 🇭🇹",desc:"On parle de tout ce soir en LIVE",user:"@darlive_officiel",likes:2100,views:22000,comments:[],url:"https://cdn.coverr.co/videos/coverr-a-man-singing-1589/1080p.mp4",followed:false,liked:false}
  ]; save();
}
function save(){localStorage.setItem('darlive_videos',JSON.stringify(videos))}
function render(){
  const feed=document.getElementById('feed'); feed.innerHTML='';
  videos.forEach(v=>{
    feed.innerHTML+=`<div class="video-card"><video src="${v.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class="overlay"><b>${v.user} ${v.followed?'• Suivi ✓':''}</b><p>${v.title}</p><p>${v.desc}</p><p>👁️ ${v.views} vues</p><button class="btn" style="width:auto;padding:8px 14px" onclick="toggleFollow(${v.id})">${v.followed?'Se désabonner':'＋ S\'abonner'}</button></div><div class="actions"><div><button class="act ${v.liked?'active':''}" onclick="toggleLike(${v.id},this)">❤️</button><small>${v.likes}</small></div><div><button class="act" onclick="openComments(${v.id})">💬</button><small>${v.comments.length}</small></div><div><button class="act" onclick="shareVideo('${v.title}')">↗️</button><small>Partager</small></div><div><button class="act" onclick="deleteVideo(${v.id})">🗑️</button></div></div></div>`;
  });
  document.getElementById('statVideos').innerText=videos.length;
  document.getElementById('statLikes').innerText=videos.reduce((a,b)=>a+b.likes,0);
  document.getElementById('trendList').innerHTML=videos.sort((a,b)=>b.likes-a.likes).map(v=>`<div class="card"><b>${v.title}</b><p>${v.user} • ❤️ ${v.likes} • 👁️ ${v.views}</p><span class="badge">#1 Tendance</span></div>`).join('');
  document.getElementById('myVideos').innerHTML=videos.map(v=>`<div class="card">${v.title} - ❤️ ${v.likes}</div>`).join('');
  document.getElementById('notifList').innerHTML=`<div class="card">❤️ @fan1 a aimé ta vidéo</div><div class="card">👤 @nouveau_fan s'est abonné à toi</div><div class="card">💬 Nouveau commentaire sur ta vidéo</div>`;
  const first=document.querySelector('video'); if(first) first.play().catch(()=>{});
}
function toggleLike(id,btn){let v=videos.find(x=>x.id===id); v.liked=!v.liked; v.likes+=v.liked?1:-1; save(); render();}
function toggleFollow(id){let v=videos.find(x=>x.id===id); v.followed=!v.followed; save(); render(); alert(v.followed?'Tu es abonné à '+v.user:'Désabonné');}
function openComments(id){currentCommentId=id; openModal('commentModal'); renderComments();}
function renderComments(){let v=videos.find(x=>x.id===currentCommentId); document.getElementById('commentList').innerHTML=v.comments.map(c=>`<div class="comment"><b>${c.user}</b> : ${c.text}</div>`).join('')||'<p>Aucun commentaire. Sois le premier!</p>';}
function addComment(){let t=document.getElementById('commentInput').value; if(!t) return; let v=videos.find(x=>x.id===currentCommentId); v.comments.push({user:"@moi",text:t}); save(); document.getElementById('commentInput').value=''; renderComments(); render();}
function shareVideo(title){let link=location.href; if(navigator.share){navigator.share({title:title,url:link})} else {navigator.clipboard.writeText(link); alert('Lien copié! Partage-le: '+link)}}
function deleteVideo(id){if(confirm('Supprimer cette vidéo?')){videos=videos.filter(v=>v.id!==id); save(); render();}}
function publishVideo(){
  let file=document.getElementById('videoFile').files[0];
  let title=document.getElementById('videoTitle').value||'Ma nouvelle vidéo Da.R Live';
  let desc=document.getElementById('videoDesc').value||'#darlive';
  if(!file){alert('Chwazi yon vidéo nan telefòn ou dabor!'); return;}
  let url=URL.createObjectURL(file);
  videos.unshift({id:Date.now(),title:title,desc:desc,user:"@moi",likes:0,views:1,comments:[],url:url,followed:false,liked:false});
  save(); render(); closeModals(); alert('Vidéo publiée! 🎉');
}
function searchVideo(){let q=document.getElementById('searchInput').value.toLowerCase(); let filtered=videos.filter(v=>(v.title+v.user+v.desc).toLowerCase().includes(q)); if(!q){render();return;} const feed=document.getElementById('feed'); feed.innerHTML=filtered.map(v=>`<div class="video-card"><video src="${v.url}" controls></video><div class="overlay"><b>${v.user}</b><p>${v.title}</p></div></div>`).join('')||'<p style="padding:100px;text-align:center">Aucun résultat</p>';}
function saveProfile(){let n=document.getElementById('editName').value; let b=document.getElementById('editBio').value; if(n) document.getElementById('profileName').innerText='@'+n; if(b) document.getElementById('profileBio').innerText=b; alert('Profil mis à jour!');}
function sendMsg(){let t=document.getElementById('msgInput').value; if(!t) return; document.getElementById('msgList').innerHTML+=`<div class="card"><b>Moi:</b> ${t}</div>`; document.getElementById('msgInput').value='';}
function goLive(){alert('🔴 LIVE lancé! Tes abonnés reçoivent une notification.');}
function openModal(id){closeModals(); document.getElementById(id).classList.add('open');}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));}
function showHome(){render();}
render();
</script>
</body>
                                                                                                    </html>
