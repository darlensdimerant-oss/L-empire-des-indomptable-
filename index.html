.badge{position:absolute;top:-4px;right:6px;background:#fe2c55;color:#fff;font-size:9px;padding:2px 5px;border-radius:10px;font-weight:800}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}

.sheet{background:#111;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px;padding-bottom:30px}

// FÒMATE CHIF TANKOU TIKTOK: 11500 -> 11,5 K
function fmt(n){
  if(!n) return '0';
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.',',') + ' M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.',',') + ' K';
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}
