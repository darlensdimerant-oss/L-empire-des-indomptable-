<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DA.R LIVE 🇭🇹 - Gade Videyo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DA.R LIVE">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow-x:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:900}.logo span{color:#fe2c55}
.header button{background:#222;border:none;color:#fff;padding:8px 14px;border-radius:20px;font-weight:700}
.feed{padding-top:60px;padding-bottom:80px;max-width:480px;margin:0 auto}
.video-card{margin-bottom:2px;background:#000;border-bottom:1px solid #111;position:relative}
.video-card video,.video-card iframe{width:100%;height:580px;object-fit:cover;background:#000;border:none;display:block}
.info{padding:10px 12px}
.user-row{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(45deg,#fe2c55,#25f4ee);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.title{font-size:14px;line-height:1.4;margin-top:6px}
.actions{display:flex;gap:18px;padding:8px 12px 12px;font-size:22px}
.actions span{cursor:pointer}
.install-box{background:#111;border:1px solid #25D366;border-radius:18px;padding:16px;margin:12px;text-align:center}
.install-box h3{font-size:17px}
.install-box p{font-size:12px;color:#888;margin:6px 0 10px}
.btn-install{width:100%;padding:14px;background:#25D366;border:none;color:#fff;border-radius:25px;font-weight:800;font-size:15px}
.btn-install:active{transform:scale(.98)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.bottom-nav div{text-align:center;font-size:11px;color:#888;cursor:pointer}
.bottom-nav div.active{color:#fff}
.bottom-nav b{font-size:22px;display:block}
.empty{text-align:center;padding:60px 20px;color:#888}
.empty b{color:#fff;font-size:20px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">DA.R <span>LIVE</span> 🇭🇹</div>
  <div style="display:flex;gap:6px">
    <button onclick="location.href='upload.html'">➕ Lage</button>
    <button onclick="location.reload()">🔄</button>
  </div>
</div>

<div class="feed">
  <!-- BOUTON ENSTALE APP LA -->
  <div class="install-box" id="installBox">
    <h3>📲 Telechaje App DA.R LIVE la</h3>
    <p>Enstale l sou telefòn ou tankou TikTok - Pi rapid, pa bezwen Chrome!</p>
    <button class="btn-install" id="installBtn" onclick="installApp()">📲 TELECHARGER APP LA - ENSTALE KOUNYA</button>
    <p id="installMsg" style="color:#25D366"></p>
  </div>

  <div id="feed"></div>
</div>

<div class="bottom-nav">
  <div class="active" onclick="location.href='index.html'"><b>🏠</b>Akèy</div>
  <div onclick="document.getElementById('feed').scrollIntoView()"><b>🔍</b>Dekouvri</div>
  <div onclick="location.href='upload.html'"><b style="font-size:28px;color:#fe2c55">➕</b></div>
  <div onclick="location.href='upload.html'"><b>👤</b>Profil</div>
</div>

<script>
var sb = supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");

// --- CHAJE VIDEO YO ---
async function loadVideos(){
  var r = await sb.from('videos').select('*').order('created_at',{ascending:false}).limit(50);
  var feed = document.getElementById('feed');
  if(r.error || !r.data || r.data.length===0){
    feed.innerHTML = '<div class="empty"><b>Pa gen videyo ankò 😔</b><br><br>Se premye moun ki pou lage videyo!<br><br><button onclick="location.href=\'upload.html\'" style="padding:12px 22px;background:#fe2c55;border:none;color:#fff;border-radius:25px;font-weight:800">➕ Lage Premye Videyo a</button></div>';
    return;
  }
  var html = '';
  r.data.forEach(function(v){
    var isEmbed = v.video_url.includes('youtube.com/embed') || v.video_url.includes('tiktok.com') || v.video_url.includes('facebook.com');
    var media = isEmbed ? '<iframe src="'+v.video_url+'" allowfullscreen allow="autoplay; encrypted-media"></iframe>' : '<video src="'+v.video_url+'" controls playsinline loop preload="metadata"></video>';
    html += '<div class="video-card">'+media+'<div class="info"><div class="user-row"><div class="avatar">D</div><div><b>@darlive</b><br><span style="font-size:12px;color:#888">DA.R LIVE 🇭🇹</span></div></div><div class="title">'+(v.title||'Videyo DA.R LIVE')+'</div></div><div class="actions"><span onclick="this.innerText=\'❤️\';this.style.color=\'#fe2c55\'">🤍</span><span>💬</span><span>↗️</span><span style="margin-left:auto">🔖</span></div></div>';
  });
  feed.innerHTML = html;
}
loadVideos();

// --- PWA INSTALL - ETAP 3 ---
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installMsg').innerText = '✅ App la pare pou enstale! Peze bouton an 👆';
});
async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    let choice = await deferredPrompt.userChoice;
    if(choice.outcome === 'accepted'){
      document.getElementById('installMsg').innerText = '✅ App la ap enstale... Gade ekran akèy ou! 🎉';
      document.getElementById('installBox').style.display = 'none';
    } else {
      document.getElementById('installMsg').innerText = 'Ou anile enstalasyon an';
    }
    deferredPrompt = null;
  } else {
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)){
      alert('Sou iPhone:\n\n1. Peze bouton Share ⬆️ anba a\n2. Peze "Add to Home Screen"\n3. Peze "Add"\n\nApp la ap parèt sou ekran ou!');
    } else {
      // Si Chrome pa bay prompt la, montre kijan pou fè l manyèlman
      if(window.matchMedia('(display-mode: standalone)').matches){
        document.getElementById('installMsg').innerText = '✅ App la DEJA enstale! Ou ap itilize l kounya 🎉';
      } else {
        document.getElementById('installMsg').innerText = 'Sou Chrome: Peze 3 pwen ⋮ anwo a > Install App / Add to Home screen';
      }
    }
  }
}
// Kache bouton an si app la deja enstale
window.addEventListener('appinstalled', () => { document.getElementById('installBox').style.display = 'none'; });
if(window.matchMedia('(display-mode: standalone)').matches){ document.getElementById('installBox').style.display = 'none'; }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
