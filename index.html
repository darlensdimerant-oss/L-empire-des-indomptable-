<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DA.R LIVE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;overflow:hidden}.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent)}.logo{font-size:22px;font-weight:900}.logo span{color:#fe2c55}.top-btn{background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none}.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video{height:100dvh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.video video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.v-info{position:absolute;bottom:165px;left:14px;right:80px;z-index:10;text-shadow:0 2px 8px #000}.v-info h3{font-size:16px;font-weight:700}.v-info p{font-size:14px;color:#eee;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.actions{position:absolute;right:10px;bottom:165px;display:flex;flex-direction:column;gap:16px;z-index:10;align-items:center}.act-wrap{display:flex;flex-direction:column;align-items:center}.act{width:48px;height:48px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:pointer}.act.liked{background:#fe2c55}.act-count{font-size:12px;font-weight:700;margin-top:4px;text-shadow:0 1px 4px #000}.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-size:22px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:8px 0 14px;z-index:100}.bottom a{color:#888;text-decoration:none;font-size:10px;text-align:center;font-weight:600}.bottom a.active{color:#fff}.bottom div{font-size:22px;line-height:1}.upload-btn{background:#fff!important;color:#000!important;padding:4px 14px;border-radius:8px;font-size:22px!important;font-weight:900!important}.admin-float{position:fixed;bottom:165px;left:14px;background:#fe2c55;color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;z-index:99;box-shadow:0 4px 15px rgba(0,0,0,.6);border:2px solid #fff;opacity:.9}.login-box{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center}.login-box.show{display:flex}.card{background:#111;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;border:1px solid #333}.card input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff}.card button{width:100%;padding:13px;background:#fe2c55;border:none;color:#fff;border-radius:25px;font-weight:bold;margin-top:10px}.music{position:absolute;bottom:170px;right:12px;width:34px;height:34px;border-radius:50%;border:4px solid #222;border-top-color:#fe2c55;animation:spin 2s linear infinite;z-index:5;opacity:.7}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body>
<div class="top"><div class="logo">DA.R <span>LIVE</span> 🇭🇹</div><a class="top-btn" href="#" onclick="openLogin();return false;">Connexion</a></div>
<div class="feed" id="feed"><div class="video"><h2>DA.R <span style="color:#fe2c55">LIVE</span><p style="color:#888;font-size:14px;margin-top:10px">Ap chaje... ⏳</p></h2></div></div>
<a href="admin2.html" class="admin-float">👑</a>
<div class="bottom"><a href="index.html" class="active"><div>🏠</div>Accueil</a><a href="concours.html"><div>🏆</div>Concours</a><a href="#" onclick="openLogin();return false;"><div class="upload-btn">+</div></a><a href="messages.html"><div>💬</div>Messages</a><a href="#" onclick="openLogin();return false;"><div>👤</div>Profil</a></div>
<div class="login-box" id="loginBox"><div class="card"><h2>DA.R <span style="color:#fe2c55">LIVE</span></h2><p style="color:#888;font-size:13px;margin:5px 0 10px">Connecte ou pou kontinye</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="doLogin()">SE CONNECTER</button><button onclick="doSignup()" style="background:#222">CRÉER COMPTE</button><p id="msg" style="color:yellow;font-size:13px;margin-top:10px"></p><p onclick="document.getElementById('loginBox').classList.remove('show')" style="color:#888;margin-top:10px;cursor:pointer">Fèmen ✕</p></div></div>
<script>
const sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
function openLogin(){document.getElementById('loginBox').classList.add('show')}
async function doLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('msg').innerText=error.message}else{location.reload()}}
async function doSignup(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signUp({email:e,password:p});document.getElementById('msg').innerText=error?error.message:"Tcheke email ou! 📧"}
function toggleLike(el,countEl){el.classList.toggle('liked');let c=parseInt(countEl.innerText)||0;if(el.classList.contains('liked')){c++;el.innerHTML='❤️'}else{c--;el.innerHTML='🤍'}countEl.innerText=c}
async function loadVideos(){const {data}=await sb.from('videos').select('*,profiles(username)').order('created_at',{ascending:false}).limit(20);const feed=document.getElementById('feed');if(!data||!data.length){feed.innerHTML='<div class="video"><h2 style="text-align:center">Pa gen videyo ankò<br><span style="color:#888;font-size:14px">Admin an ap pibliye talè! 👑</span></h2></div>';return}feed.innerHTML=data.map(v=>`<div class="video"><video src="${v.video_url||''}" loop muted playsinline autoplay onclick="this.paused?this.play():this.pause()" poster="${v.thumbnail_url||''}"></video><div class="v-info"><h3>@${v.profiles?.username||'darlive'} • Suivre</h3><p>${v.title||''}</p><p style="font-size:12px;color:#ccc">🎵 Son original - DA.R LIVE</p></div><div class="actions"><div class="act-wrap"><div class="avatar">👤</div></div><div class="act-wrap"><div class="act" onclick="toggleLike(this,this.nextElementSibling)">🤍</div><span class="act-count">${v.likes_count||0}</span></div><div class="act-wrap"><div class="act">💬</div><span class="act-count">0</span></div><div class="act-wrap"><div class="act">↗️</div><span class="act-count">Partager</span></div></div><div class="music"></div></div>`).join('');}
loadVideos();
</script></body></html>
