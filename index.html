<script>
const sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
let soundOn=true, unlocked=false, currentVideoId=null, currentCountEl=null;
const LANG={
fr:{login:'Connexion',home:'Accueil',concours:'Concours',msg:'Messages',profil:'Profil',loading:'Chargement... ⏳',loginSub:'Connectez-vous pour continuer',seConnecter:'SE CONNECTER',creer:'CRÉER UN COMPTE',fermer:'Fermer ✕',cmPlaceholder:'Ajouter un commentaire... 😍',cmEmpty:'Pas encore de commentaire. Soyez le premier ! 👇',cmTitle:'commentaire',setTitle:'Paramètres',setLangTitle:'Langue / Lang',setLangSub:'Choisir la langue de l\'application',setContactTitle:'Contacter le développeur',tapSound:'👆 Touchez l\'écran pour le SON 🔊',follow:'Suivre',share:'Partager'},
ht:{login:'Koneksyon',home:'Akèy',concours:'Konkou',msg:'Mesaj',profil:'Pwofil',loading:'Ap chaje... ⏳',loginSub:'Konekte ou pou kontinye',seConnecter:'KONEKTE',creer:'KREYE KONT',fermer:'Fèmen ✕',cmPlaceholder:'Ajoute yon komantè... 😍',cmEmpty:'Pa gen komantè ankò. Se premye moun ki komante! 👇',cmTitle:'komantè',setTitle:'Paramèt',setLangTitle:'Lang / Langue',setLangSub:'Chwazi lang aplikasyon an',setContactTitle:'Kontakte devlopè a',tapSound:'👆 Manyen ekran an pou SON 🔊',follow:'Swiv',share:'Pataje'}
};
let curLang=localStorage.getItem('dar_lang')||'fr';
function applyLang(){const t=LANG[curLang];document.getElementById('btnLogin').innerText=t.login;document.getElementById('navHome').innerText=t.home;document.getElementById('navConcours').innerText=t.concours;document.getElementById('navMsg').innerText=t.msg;document.getElementById('navProfil').innerText=t.profil;document.getElementById('loginSub').innerText=t.loginSub;document.getElementById('btnSeConnecter').innerText=t.seConnecter;document.getElementById('btnCreer').innerText=t.creer;document.getElementById('btnFermer').innerText=t.fermer;document.getElementById('cmText').placeholder=t.cmPlaceholder;document.getElementById('setTitle').innerText=t.setTitle;document.getElementById('setLangTitle').innerText=t.setLangTitle;document.getElementById('setLangSub').innerText=t.setLangSub;document.getElementById('setContactTitle').innerText=t.setContactTitle;document.getElementById('btnFr').classList.toggle('active',curLang==='fr');document.getElementById('btnHt').classList.toggle('active',curLang==='ht');document.querySelectorAll('.tap-sound').forEach(e=>e.innerText=t.tapSound);document.documentElement.lang=curLang==='fr'?'fr':'ht';}
function setLang(l){curLang=l;localStorage.setItem('dar_lang',l);applyLang();loadVideos();}
function unlockSound(){if(unlocked)return;unlocked=true;document.querySelectorAll('video').forEach(v=>{v.muted=false;v.volume=1;v.play().catch(()=>{})});document.querySelectorAll('.sound-btn').forEach(b=>{b.innerHTML='🔊';b.classList.add('on')});document.querySelectorAll('.tap-sound').forEach(t=>t.style.display='none');}
document.addEventListener('touchstart',unlockSound,{passive:true});document.addEventListener('click',unlockSound);
function openLogin(){document.getElementById('loginBox').classList.add('show')}
async function doLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('msg').innerText=error.message}else{location.reload()}}
async function doSignup(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signUp({email:e,password:p});document.getElementById('msg').innerText=error?error.message:curLang==='fr'?'Vérifiez votre email! 📧':'Tcheke email ou! 📧'}
function fmt(n){if(n>=1000)return (n/1000).toFixed(1).replace('.0','')+' K';return n}
function toggleLike(el,countEl){el.parentElement.classList.toggle('liked');let c=parseInt(countEl.dataset.raw||0);if(el.parentElement.classList.contains('liked')){c++;el.innerHTML='❤️'}else{c--;el.innerHTML='🤍'}countEl.dataset.raw=c;countEl.innerText=fmt(c)}
function toggleSave(el,countEl){el.parentElement.classList.toggle('saved');let c=parseInt(countEl.dataset.raw||0);if(el.parentElement.classList.contains('saved')){c++;el.style.color='#fe2c55'}else{c--;el.style.color='#fff'}countEl.dataset.raw=c;countEl.innerText=fmt(c)}
function shareVideo(title){if(navigator.share){navigator.share({title:'DA.R LIVE',text:title,url:location.href})}else{alert('Lien copié! 📋')}}
function toggleSound(btn,vidId){const v=document.getElementById(vidId);soundOn=!soundOn;v.muted=!soundOn;v.volume=1;if(soundOn){v.play();btn.innerHTML='🔊';btn.classList.add('on');unlocked=true}else{btn.innerHTML='🔇';btn.classList.remove('on');}}
function tapVideo(v,btnId){if(!unlocked){unlockSound();return}if(v.paused)v.play();else v.pause();}
function getLocalComments(id){try{return JSON.parse(localStorage.getItem('cm_'+id)||'[]')}catch(e){return[]}}
function saveLocalComment(id,obj){const arr=getLocalComments(id);arr.unshift(obj);localStorage.setItem('cm_'+id,JSON.stringify(arr));return arr}
function renderComments(list){const el=document.getElementById('cmList');const t=LANG[curLang];if(!list.length){el.innerHTML=`<p style="text-align:center;color:#888;padding:20px">${t.cmEmpty}</p>`;document.getElementById('cmCount').innerText='0 '+t.cmTitle;return}document.getElementById('cmCount').innerText=list.length+' '+t.cmTitle+(list.length>1&&curLang==='fr'?'s':'');el.innerHTML=list.map(c=>`<div class="cm-item"><div class="cm-ava">👤</div><div><b style="font-size:13px">@${(c.username||'fan').slice(0,12)}</b><p style="font-size:14px;margin-top:2px">${c.content}</p></div></div>`).join('')}
function openComments(videoId,countEl){currentVideoId=videoId;currentCountEl=countEl;document.getElementById('cmSheet').classList.add('open');document.getElementById('overlay').classList.add('show');loadComments(videoId)}
function closeComments(){document.getElementById('cmSheet').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function closeAllSheets(){closeComments();closeSettings()}
async function loadComments(videoId){const {data,error}=await sb.from('comments').select('*').eq('video_id',videoId).order('created_at',{ascending:false});if(error||!data){renderComments(getLocalComments(videoId));return}if(data.length){renderComments(data)}else{renderComments(getLocalComments(videoId))}}
async function sendComment(){const txt=document.getElementById('cmText');const content=txt.value.trim();if(!content||!currentVideoId)return;const {data:{user}}=await sb.auth.getUser();const username=user?user.email.split('@')[0]:'fan';const obj={username,content,created_at:new Date().toISOString()};const {error}=await sb.from('comments').insert({video_id:currentVideoId,content,username});if(!error){loadComments(currentVideoId)}else{const arr=saveLocalComment(currentVideoId,obj);renderComments(arr)}txt.value='';if(currentCountEl){let c=parseInt(currentCountEl.dataset.raw||0)+1;currentCountEl.dataset.raw=c;currentCountEl.innerText=fmt(c)}}
function openSettings(){document.getElementById('setSheet').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeSettings(){document.getElementById('setSheet').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
async function loadVideos(){const {data}=await sb.from('videos').select('*,profiles(username)').order('created_at',{ascending:false}).limit(20);const feed=document.getElementById('feed');const t=LANG[curLang];if(!data||!data.length){feed.innerHTML='<div class="video"><h2 style="text-align:center">Pas encore de vidéo</h2></div>';return}feed.innerHTML=data.map((v,i)=>`<div class="video"><video id="vid${i}" src="${v.video_url||''}" loop playsinline autoplay muted onclick="tapVideo(this,'snd${i}')"></video><div class="tap-sound">${t.tapSound}</div><div class="sound-btn on" id="snd${i}" onclick="toggleSound(this,'vid${i}')">🔊</div><div class="v-info"><h3>@${v.profiles?.username||'darlive'} • ${t.follow}</h3><p>${v.title||''}</p></div><div class="actions"><div class="act-wrap"><div class="avatar">👤</div></div><div class="act-wrap" onclick="toggleLike(this.querySelector('.act'),this.querySelector('.act-count'))"><div class="act">🤍</div><span class="act-count" data-raw="${v.likes_count||0}">${fmt(v.likes_count||0)}</span></div><div class="act-wrap" onclick="openComments('${v.id}',this.querySelector('.act-count'))"><div class="act">💬</div><span class="act-count" data-raw="${v.comments_count||0}">${fmt(v.comments_count||0)}</span></div><div class="act-wrap" onclick="toggleSave(this.querySelector('.act'),this.querySelector('.act-count'))"><div class="act">🔖</div><span class="act-count" data-raw="${v.saves_count||0}">${fmt(v.saves_count||0)}</span></div><div class="act-wrap" onclick="shareVideo('${(v.title||'').replace(/'/g,'')}')"><div class="act">➡️</div><span class="act-count" data-raw="${v.shares_count||0}">${fmt(v.shares_count||0)}</span></div></div></div>`).join('');const first=document.querySelector('video');if(first){first.muted=false;first.volume=1;first.play().then(()=>{unlocked=true;document.querySelectorAll('.tap-sound').forEach(t=>t.style.display='none')}).catch(()=>{})}const obs=new IntersectionObserver((es)=>{es.forEach(e=>{const vid=e.target.querySelector('video');if(!vid)return;if(e.isIntersecting){vid.muted=!unlocked;vid.volume=1;vid.play().catch(()=>{});}else vid.pause();})},{threshold:0.6});document.querySelectorAll('.video').forEach(el=>obs.observe(el));}
applyLang();loadVideos();
</script></body></html>
