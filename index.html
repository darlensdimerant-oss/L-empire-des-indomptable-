<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'EMPIRE - Ultimate Ban Hammer</title>
    <style>
        /* --- DESIGN IMPERIAL --- */
        :root { --red: #ff0000; --gold: #ffd700; --dark: #0a0a0a; }
        body {
            background-color: var(--dark);
            color: #ccc;
            font-family: 'Courier New', monospace;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: radial-gradient(circle at center, #1a0000 0%, #000 70%);
        }
        .container {
            width: 90%; max-width: 800px; background: #111; border: 1px solid #333; padding: 20px;
            box-shadow: 0 0 30px rgba(255,0,0,0.2); border-radius: 8px;
        }
        h1 { color: var(--gold); text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        
        label { display: block; margin-top: 15px; color: var(--red); font-weight: bold; }
        input, textarea, select {
            width: 100%; padding: 10px; background: #222; border: 1px solid #444; 
            color: white; margin-top: 5px; font-family: inherit;
        }
        button {
            width: 100%; padding: 15px; margin-top: 20px; background: var(--red); 
            color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold;
            text-transform: uppercase; transition: 0.3s;
        }
        button:hover { background: #cc0000; box-shadow: 0 0 15px var(--red); }
        
        .output-box {
            margin-top: 20px; background: #000; border: 1px dashed #555; padding: 15px; 
            max-height: 300px; overflow-y: auto; display: none; font-size: 12px; white-space: pre-wrap;
        }
        .copy-btn { background: #333; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>L'Empire de Dimerant<br><span style="font-size:0.6em; color:#fff;">Ultimate Ban Hammer</span></h1>

    <label>Lien du Groupe / Communauté Cible</label>
    <input type="text" id="targetLink" placeholder="https://chat.whatsapp.com/...">

    <label>Nom du Groupe (pour la crédibilité)</label>
    <input type="text" id="groupName" placeholder="Ex: Les Rois du Chaos">

    <label>Lien vers la Preuve (Capture d'écran hébergée sur Imgur/ImgBB)</label>
    <input type="text" id="proofLink" placeholder="https://i.imgur.com/...">

    <label>Type de Violation</label>
    <select id="violationType">
        <option value="spam_moderne">SPAM MODERNE (Bouillon & Flood)</option>
        <option value="contenu_sensible">CONTENU SENSIBLE (NSFW/Mineurs)</option>
        <option value="phishing_harcellement">HARCELEMENT / PHISHING</option>
        <option value="abus_api_abus_droit">ABUS DE DROIT (RGPD/Droit à l'oubli)</option>
    </select>

    <button onclick="generateBanEmail()">GÉNÉRER L'ATTAQUE PAR EMAIL</button>

    <div id="output" class="output-box"></div>
    
    <!-- Boutons d'envoi direct -->
    <div id="sendButtons" style="display:none; margin-top:20px;">
        <h3 style="color:white; text-align:center;">CLIQUEZ POUR OUVRIR VOTRE MAIL :</h3>
        <button onclick="openMail('support@whatsapp.com')" style="background:#333; margin-bottom:5px;">📧 À : support@whatsapp.com</button>
        <button onclick="openMail('legal@facebook.com')" style="background:#333; margin-bottom:5px;">⚖️ À : legal@facebook.com</button>
        <button onclick="openMail('privacy@meta.com')" style="background:#333;">🛡️ À : privacy@meta.com</button>
    </div>
</div>

<script>
let currentSubject = "";
let currentBody = "";

function generateBanEmail() {
    const link = document.getElementById('targetLink').value;
    const name = document.getElementById('groupName').value || "Groupe Cible";
    const proof = document.getElementById('proofLink').value;
    const type = document.getElementById('violationType').value;
    
    let subject = "";
    let body = "";

    // Construction du message selon le type
    if(type === 'spam_moderne') {
        subject = `[URGENT] Signalement Spam Automatisé Massif - ${name}`;
        body = `À l'attention du Service Modération WhatsApp,\n\nNous signalons une violation massive des conditions d'utilisation concernant le groupe : "${name}".\nLien : ${link}\n\nCe groupe n'est plus un espace de discussion mais un canal de SPAM automatisé.\n- Ingestion de milliers de messages en quelques minutes.\n- Utilisation de bots non identifiés pour inonder les boîtes de réception des utilisateurs.\n- Perturbation de l'expérience utilisateur (UX) rendant l'application inutilisable pour les membres.\n\nPreuve visuelle : ${proof}\n\nConformément à notre demande de nettoyage immédiat, nous exigeons la suspension temporaire du groupe pour vérification algorithmique.\n\nCordialement,\nL'Empire des Indomptables.`;
    } else if (type === 'contenu_sensible') {
        subject = `[SIGNALEMENT CRITIQUE] Contenu NSFW / Mineurs - ${name}`;
        body = `Bonjour,\n\nLe groupe lié par ce lien : ${link} diffuse massivement du contenu sensible (NSFW/Pornographie) sans avertissement préalable (Age Gate).\n\nDe nombreux utilisateurs mineurs y ont accès directement depuis leur liste de chats.\nCela constitue une violation directe de la politique de sécurité des enfants de Meta.\n\nPreuve visuelle : ${proof}\n\nMerci de bloquer le groupe avant que davantage de mineurs ne soient exposés.\n\nL'Empire des Indomptables.`;
    } else {
        subject = `[MÉTHODE CPV] Réclamation Droits Utilisateurs - ${name}`;
        body = `Objet : Demande de suppression immédiate pour abus de données.\n\nAu nom des utilisateurs du groupe ${link},\n\nNous constatons une conservation abusive de nos données personnelles et de nos historiques de discussions sans consentement clair suite aux derniers mises à jour de la politique de confidentialité.\n\nPar conséquent, nous exerçons notre droit à la suppression définitive (Right to be Forgotten).\n\nPreuve visuelle : ${proof}\n\nMerci de procéder au bannissement et à la purge des données de ce groupe sous 24h.\n\nL'Empire des Indomptables.`;
    }

    currentSubject = subject;
    currentBody = body;

    // Affichage du résumé
    const outputDiv = document.getElementById('output');
    outputDiv.style.display = 'block';
    outputDiv.innerHTML = `<strong>SUBJECT:</strong> ${subject}\n\n<strong>BODY:</strong>\n${body}`;
    
    // Afficher les boutons d'envoi
    document.getElementById('sendButtons').style.display = 'block';
}

function openMail(emailAddress) {
    // Création du lien mailto pour ouvrir directement l'app Gmail ou le client mail
    const mailtoLink = `mailto:${emailAddress}?subject=${encodeURIComponent(currentSubject)}&body=${encodeURIComponent(currentBody)}`;
    window.location.href = mailtoLink;
}
</script>

</body>
  </html>
