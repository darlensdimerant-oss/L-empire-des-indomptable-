<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding-bottom:30px}
.header{background:#111;padding:15px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #fe2c55}
.logo{font-size:28px;font-weight:900}.logo span{color:#fe2c55}
.subtitle{color:#aaa;font-size:13px;margin-top:3px}
.hero{background:linear-gradient(135deg,#fe2c55,#25f4ee);padding:30px 15px;text-align:center;border-radius:0 0 20px 20px}
.hero h1{font-size:26px;margin-bottom:8px}.hero p{font-size:14px;opacity:.9}
.section{padding:15px}.section h2{font-size:19px;margin-bottom:12px}
.live-card{background:#1a1a1a;border-radius:15px;overflow:hidden;margin-bottom:15px;border:1px solid #333}
.live-img{height:170px;background:linear-gradient(45deg,#fe2c55,#000);display:flex;align-items:center;justify-content:center;font-size:55px}
.live-info{padding:12px}.live-badge{background:#fe2c55;color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.live-title{font-weight:bold;margin:8px 0 4px}.live-user{color:#aaa;font-size:13px}
.btn-main{background:#fe2c55;color:#fff;border:none;padding:15px 25px;border-radius:30px;font-weight:bold;font-size:16px;width:100%;cursor:pointer}
.btn-whatsapp{background:#25D366;color:#fff;border:none;padding:12px 20px;border-radius:30px;font-weight:bold;font-size:14px;width:100%;cursor:pointer;margin-top:10px}
.btn-outline{background:transparent;color:#fff;border:2px solid #fe2c55;padding:12px 20px;border-radius:30px;font-weight:bold;width:100%;cursor:pointer;margin-top:10px}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.video-card{background:#1a1a1a;border-radius:12px;overflow:hidden}
.video-thumb{height:120px;background:#222;display:flex;align-items:center;justify-content:center;font-size:35px}
.video-info{padding:8px}
.ia-card{background:#1a1a1a;border-radius:15px;padding:10px;margin-bottom:15px;border:1px solid #333}
.member-card{background:linear-gradient(135deg,#1a1a1a,#2a0a15);border:2px solid #fe2c55;border-radius:15px;padding:15px;display:flex;gap:15px;align-items:center;margin-bottom:15px}
.member-img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #fe2c55}
.tiktok-btn{background:#fe2c55;color:#fff;border:none;padding:12px;border-radius:25px;font-weight:bold;width:100%;margin-top:8px;cursor:pointer;font-size:14px}
.install-box{text-align:center;background:#1a1a1a;border-radius:15px;margin:15px;padding:20px;border:1px solid #333}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;margin-bottom:10px;font-size:15px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#1a1a1a;width:100%;max-width:380px;border-radius:20px;padding:20px;border:1px solid #fe2c55}
footer{text-align:center;color:#777;padding:20px;font-size:12px}
</style>
</head>
