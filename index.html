lor:#fff;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;z-index:9999;box-shadow:0 4px 15px rgba(254,44,85,.6);border:2px solid #fff}.login-box{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center}.login-box.show{display:flex}.card{background:#111;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;border:1px solid #333}.card input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff}.card button{width:100%;padding:13px;background:#fe2c55;border:none;color:#fff;border-radius:25px;font-weight:bold;margin-top:10px}</style></head><body>

<script>
const sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
function openLogin(){document.getElementById('loginBox').classList.add('show')}
async function doLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('msg').innerText=error.message}else{location.reload()}}
