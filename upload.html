<script>
var sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
var selected=[], links=[];

function switchTab(t){
document.getElementById('tFile').classList.toggle('active',t==='file');
document.getElementById('tLink').classList.toggle('active',t==='link');
document.getElementById('boxFile').style.display=t==='file'?'block':'none';
document.getElementById('boxLink').style.display=t==='link'?'block':'none';
}

// --- INFO APP ---
async function loadStats(){
var v=await sb.from('videos').select('id',{count:'exact'});
var c=await sb.from('comments').select('id',{count:'exact'});
var u=await sb.from('profiles').select('id',{count:'exact'});
document.getElementById('sV').innerText=v.count||0;
document.getElementById('sC').innerText=c.count||0;
document.getElementById('sU').innerText=u.count||0;
document.getElementById('sL').innerText='🔥';
}
loadStats();

// --- FICHYE ---
document.getElementById('files').addEventListener('change',function(e){
selected=Array.from(e.target.files).slice(0,5);
if(e.target.files.length>5) alert('5 videyo max! Mwen pran 5 premye yo.');
document.getElementById('list').innerHTML=selected.map(function(f,i){
return '<div class="item"><video src="'+URL.createObjectURL(f)+'" muted></video><div style="flex:1"><b>'+f.name.slice(0,25)+'</b><p style="font-size:12px;color:#888">'+(f.size/1024/1024).toFixed(1)+' MB • <span id="st'+i+'">Ap tann... ⏳</span></p><div class="bar"><div class="fill" id="bar'+i+'"></div></div></div></div>'
}).join('');
});

async function uploadOne(f,i,username){
var st=document.getElementById('st'+i), bar=document.getElementById('bar'+i);
try{
st.innerText='Ap monte... 🚀'; bar.style.width='20%';
var name=Date.now()+'_'+i+'_'+f.name.replace(/[^a-zA-Z0-9.]/g,'');
var up=await sb.storage.from('videos').upload(name,f,{upsert:true});
if(up.error) throw new Error(up.error.message+' | Ale nan Supabase > Storage > videos > Make Public');
bar.style.width='60%'; st.innerText='Ap anrejistre...';
var url=sb.storage.from('videos').getPublicUrl(name).data.publicUrl;
var ins=await sb.from('videos').insert({title:f.name.replace(/\.[^/.]+$/,''),video_url:url,username:username||'darlive',source:'upload'});
if(ins.error) throw new Error(ins.error.message);
bar.style.width='100%'; bar.style.background='#25D366'; st.innerText='✅ FINI!';
return true;
}catch(err){ st.innerText='❌ '+err.message; bar.style.background='red'; document.getElementById('msgFile').innerText='ERÈ: '+err.message; return false; }
}

async function uploadAll(){
if(!selected.length){alert('Chwazi videyo yo anvan!');return}
var user=document.getElementById('myName').value.trim()||'darlive';
document.getElementById('btnFile').innerText='Ap lage... ⏳ Pa fèmen paj la'; document.getElementById('btnFile').disabled=true;
document.getElementById('msgFile').innerText='';
// 5 yo ap monte AN MENM TAN
var res=await Promise.all(selected.map(function(f,i){return uploadOne(f,i,user)}));
var ok=res.filter(Boolean).length;
document.getElementById('msgFile').innerText=ok+' / '+selected.length+' videyo lage! ✅';
document.getElementById('btnFile').innerText='✅ FINI - Lage Lòt Ankò'; document.getElementById('btnFile').disabled=false;
if(ok>0) setTimeout(function(){location.href='index.html'},1800);
}
