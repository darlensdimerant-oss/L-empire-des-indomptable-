<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lage 5 Videyo - DA.R LIVE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:16px}.logo{font-size:22px;font-weight:900;text-align:center;margin-bottom:14px}.logo span{color:#fe2c55}.box{background:#111;border:1px solid #333;border-radius:20px;padding:16px}input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff}button{width:100%;padding:14px;background:#fe2c55;border:none;color:#fff;border-radius:25px;font-weight:800;margin-top:10px;cursor:pointer}.item{background:#1a1a1a;border-radius:14px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center}.item video{width:70px;height:90px;object-fit:cover;border-radius:10px;background:#000}.bar{height:8px;background:#333;border-radius:20px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#fe2c55;width:0%;transition:width .3s}.badge{font-size:11px;background:#fe2c55;padding:3px 8px;border-radius:20px}.back{color:#fff;text-decoration:none;font-size:14px}</style></head><body>
<a class="back" href="index.html">← Tounen</a>
<div class="logo">DA.R <span>LIVE</span> 🇭🇹</div>
<div class="box">
<h3 style="text-align:center">Lage Jiska 5 Videyo An Menm Tan 🎬🔥</h3>
<p style="text-align:center;color:#888;font-size:13px;margin:6px 0">Chwazi 5 videyo - Yo tout ap monte ansanm!</p>
<input type="file" id="files" accept="video/*" multiple>
<div id="list"></div>
<button onclick="uploadAll()" id="btn">📤 LAGE TOUT 5 YO AN MENM TAN</button>
<p id="msg" style="text-align:center;margin-top:10px;color:#25D366;font-size:13px"></p>
<button onclick="location.href='index.html'" style="background:#222">👀 Gade Sit La</button>
</div>
<script>
var sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x");
var selected=[];
document.getElementById('files').addEventListener('change',function(e){
selected=Array.from(e.target.files).slice(0,5);
if(e.target.files.length>5){alert('Ou ka chwazi 5 videyo selman! Mwen pran 5 premye yo.')}
render();
});
function render(){
document.getElementById('list').innerHTML=selected.map(function(f,i){
return '<div class="item"><video src="'+URL.createObjectURL(f)+'" muted></video><div style="flex:1"><b>'+f.name.slice(0,25)+'</b><p style="font-size:12px;color:#888">'+(f.size/1024/1024).toFixed(1)+' MB • <span id="st'+i+'">Ap tann... ⏳</span></p><div class="bar"><div class="fill" id="bar'+i+'"></div></div></div></div>'
}).join('');
}
async function uploadOne(f,i){
document.getElementById('st'+i).innerText='Ap monte... 🚀';
document.getElementById('bar'+i).style.width='30%';
var name=Date.now()+'_'+i+'_'+f.name.replace(/[^a-zA-Z0-9.]/g,'');
var up=await sb.storage.from('videos').upload(name,f);
if(up.error){document.getElementById('st'+i).innerText='❌ Erè: '+up.error.message;return}
document.getElementById('bar'+i).style.width='70%';
document.getElementById('st'+i).innerText='Ap anrejistre...';
var url=sb.storage.from('videos').getPublicUrl(name).data.publicUrl;
var title=f.name.replace(/\.[^/.]+$/,'')||'Videyo DA.R LIVE';
var ins=await sb.from('videos').insert({title:title,video_url:url,username:'darlive'});
if(ins.error){document.getElementById('st'+i).innerText='❌ '+ins.error.message}
else{document.getElementById('bar'+i).style.width='100%';document.getElementById('st'+i).innerText='✅ FINI!';}
}
async function uploadAll(){
if(!selected.length){alert('Chwazi videyo yo anvan!');return}
document.getElementById('btn').innerText='Ap lage 5 yo... ⏳ Pa fèmen paj la';
document.getElementById('btn').disabled=true;
// 5 yo ap monte AN MENM TAN - Promise.all
await Promise.all(selected.map(function(f,i){return uploadOne(f,i)}));
document.getElementById('msg').innerText='✅ TOUT 5 VIDEVO YO LAGE! Ale gade yo!';
document.getElementById('btn').innerText='✅ FINI - Lage Lòt 5 Ankò';
document.getElementById('btn').disabled=false;
setTimeout(function(){location.href='index.html'},2000);
}
</script></body></html>
