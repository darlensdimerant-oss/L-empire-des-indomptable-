<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lage Videyo - DA.R LIVE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:14px}.logo{font-size:24px;font-weight:900;text-align:center}.logo span{color:#fe2c55}.box{background:#111;border:1px solid #333;border-radius:20px;padding:16px;margin-top:12px}input,select{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff}button.main{width:100%;padding:14px;background:#fe2c55;border:none;color:#fff;border-radius:25px;font-weight:800;margin-top:10px}.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:12px;background:#222;border:none;color:#fff;border-radius:25px;font-weight:800}.tabs button.active{background:#fe2c55}.item{background:#1a1a1a;border-radius:14px;padding:10px;margin-top:10px}.bar{height:8px;background:#333;border-radius:20px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#25D366;width:0%}.debug{background:#1a1a1a;border:1px solid #ffcc00;border-radius:12px;padding:10px;font-size:12px;margin-top:12px;white-space:pre-wrap;word-break:break-all}</style></head><body>
<a href="index.html" style="color:#fff;text-decoration:none">← Tounen</a>
<div class="logo">DA.R <span>LIVE</span> 🇭🇹</div>

<div class="box" style="text-align:center">
<b>🔌 TÈS KONEKSYON</b>
<p id="testMsg" style="font-size:13px;color:#ffcc00;margin:6px 0">Ap teste...</p>
<button onclick="testConn()" style="padding:10px 20px;background:#222;border:none;color:#fff;border-radius:20px">🔄 Teste Ankò</button>
<div id="stats" style="display:flex;gap:8px;margin-top:10px"><div style="flex:1;background:#1a1a1a;padding:10px;border-radius:12px"><b id="sV">-</b><br><span style="font-size:11px;color:#888">Videyo</span></div><div style="flex:1;background:#1a1a1a;padding:10px;border-radius:12px"><b id="sC">-</b><br><span style="font-size:11px;color:#888">Kòmantè</span></div></div>
</div>

<div class="tabs" style="margin-top:12px">
<button id="tFile" class="active" onclick="sw('file')">📁 Fichye (5)</button>
<button id="tLink" onclick="sw('link')">🔗 Lyen TikTok / YouTube</button>
</div>

<div id="boxFile" class="box">
<h3 style="text-align:center">Lage Jiska 5 Videyo</h3>
<input type="text" id="myName" placeholder="Non ou - Ex: admin1" value="admin1">
<input type="file" id="files" accept="video/*" multiple>
<div id="list"></div>
<button class="main" onclick="uploadAll()" id="btnFile">📤 LAGE TOUT YO</button>
<p id="msgFile" style="text-align:center;margin-top:8px;color:#ffcc00;font-size:13px"></p>
</div>

<div id="boxLink" class="box" style="display:none">
<h3 style="text-align:center">Kole Lyen Videyo 🔗</h3>
<p style="text-align:center;color:#888;font-size:12px">TikTok • YouTube • Instagram • Facebook<br>Sa a mache menm si upload fichye a pa mache!</p>
<select id="platform"><option value="tiktok">🎵 TikTok</option><option value="youtube">▶️ YouTube</option><option value="instagram">📸 Instagram</option><option value="facebook">📘 Facebook</option><option value="direct">🔗 Lyen .mp4</option></select>
<input type="text" id="linkTitle" placeholder="Tit videyo a">
<input type="text" id="linkUrl" placeholder="Kole lyen an isit https://...">
<input type="text" id="linkUser" placeholder="Non ou" value="admin1">
<button class="main" onclick="sendLink()" style="background:#25D366">✅ VOYE LYEN SA A SOU SIT LA</button>
<p id="msgLink" style="text-align:center;margin-top:8px;color:#25D366;font-size:13px"></p>
</div>

<div id="debug" class="debug">Debug: Ap tann...</div>
<button class="main" onclick="location.href='index.html'" style="background:#222">👀 Gade Sit La</button>

<script>
var sb;
try{ sb=supabase.createClient("https://xvgjijnggncarummnkrb.supabase.co","sb_publishable_71YHalZ_rCO8N0ByZcIuzg_fug-NG5x"); document.getElementById('debug').innerText='Debug: Supabase chaje OK'; }catch(e){ document.getElementById('debug').innerText='Debug ERÈ: '+e.message; }
var selected=[];
function sw(t){ document.getElementById('tFile').classList.toggle('active',t==='file'); document.getElementById('tLink').classList.toggle('active',t==='link'); document.getElementById('boxFile').style.display=t==='file'?'block':'none'; document.getElementById('boxLink').style.display=t==='link'?'block':'none'; }

async function testConn(){
  document.getElementById('testMsg').innerText='Ap teste...';
  try{
    var v=await sb.from('videos').select('id').limit(1);
    if(v.error) throw new Error(v.error.message);
    document.getElementById('testMsg').innerText='✅ KONEKTE! Supabase ap mache!';
    document.getElementById('testMsg').style.color='#25D366';
    var all=await sb.from('videos').select('id');
    document.getElementById('sV').innerText=all.data?all.data.length:0;
    var c=await sb.from('comments').select('id');
    document.getElementById('sC').innerText=c.data?c.data.length:0;
    document.getElementById('debug').innerText='Debug: Koneksyon OK - '+JSON.stringify(all.data||[]).slice(0,200);
  }catch(err){
    document.getElementById('testMsg').innerText='❌ PA KONEKTE: '+err.message;
    document.getElementById('testMsg').style.color='red';
    document.getElementById('debug').innerText='Debug ERÈ: '+err.message+'\n\nSOLISYON: Ale nan Supabase > SQL Editor > Kole kòd SQL mwen ba ou anwo a > RUN';
  }
}
testConn();

document.getElementById('files').addEventListener('change',function(e){
  selected=Array.from(e.target.files).slice(0,5);
  var html='';
  for(var i=0;i<selected.length;i++){ var f=selected[i]; html+='<div class="item"><b>'+f.name+'</b><p style="font-size:12px;color:#888">'+(f.size/1024/1024).toFixed(1)+' MB • <span id="st'+i+'">Pare ⏳</span></p><div class="bar"><div class="fill" id="bar'+i+'"></div></div></div>'; }
  document.getElementById('list').innerHTML=html;
  document.getElementById('msgFile').innerText=selected.length+' videyo chwazi ✅ Peze LAGE TOUT YO';
});

async function uploadOne(f,i,user){
  var st=document.getElementById('st'+i), bar=document.getElementById('bar'+i);
  try{
    st.innerText='Ap monte... 🚀'; bar.style.width='25%';
    var name=Date.now()+'_'+i+'_'+f.name.replace(/[^a-zA-Z0-9.]/g,'');
    var up=await sb.storage.from('videos').upload(name,f,{upsert:true});
    if(up.error) throw new Error('STORAGE: '+up.error.message);
    bar.style.width='60%'; st.innerText='Ap anrejistre...';
    var url=sb.storage.from('videos').getPublicUrl(name).data.publicUrl;
    var ins=await sb.from('videos').insert({title:f.name.replace(/\.[^/.]+$/,''),video_url:url,username:user,source:'upload'});
    if(ins.error) throw new Error('TABLE: '+ins.error.message);
    bar.style.width='100%'; st.innerText='✅ FINI!';
    return true;
  }catch(err){ st.innerText='❌ '+err.message; document.getElementById('debug').innerText='Debug ERÈ Upload: '+err.message; document.getElementById('msgFile').innerText='❌ '+err.message; return false; }
}
async function uploadAll(){
  if(!selected.length){ alert('Chwazi videyo yo anvan! Peze Select. fichiers'); return; }
  var user=document.getElementById('myName').value.trim()||'admin1';
  document.getElementById('btnFile').innerText='Ap lage... Pa fèmen paj la ⏳'; document.getElementById('btnFile').disabled=true;
  var res=await Promise.all(selected.map(function(f,i){return uploadOne(f,i,user)}));
  var ok=res.filter(Boolean).length;
  document.getElementById('msgFile').innerText=ok+' / '+selected.length+' lage ✅';
  document.getElementById('btnFile').innerText='✅ FINI'; document.getElementById('btnFile').disabled=false;
  if(ok>0) setTimeout(function(){location.href='index.html'},1500);
}
function getEmbed(url,plat){
  if(plat==='youtube'){ var m=url.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/); if(m) return 'https://www.youtube.com/embed/'+m[1]; }
  return url;
}
async function sendLink(){
  var plat=document.getElementById('platform').value;
  var title=document.getElementById('linkTitle').value.trim()||'Videyo DA.R LIVE';
  var url=document.getElementById('linkUrl').value.trim();
  var user=document.getElementById('linkUser').value.trim()||'admin1';
  if(!url.startsWith('http')){ alert('Kole yon lyen ki kòmanse ak https://'); return; }
  document.getElementById('msgLink').innerText='Ap voye... ⏳';
  var ins=await sb.from('videos').insert({title:title,video_url:getEmbed(url,plat),username:user,source:plat,original_url:url});
  if(ins.error){ document.getElementById('msgLink').innerText='❌ ERÈ: '+ins.error.message; document.getElementById('debug').innerText='Debug ERÈ Lyen: '+ins.error.message; }
  else{ document.getElementById('msgLink').innerText='✅ LYEN AN SOU SIT LA!'; setTimeout(function(){location.href='index.html'},1200); }
}
</script></body></html>
